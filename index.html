  async function getRecommendation() {
    const budget = document.getElementById('budget').value;
    const purpose = document.getElementById('purpose').value;
    const resultDiv = document.getElementById('result');
    const loadingDiv = document.getElementById('loading');

    if (!budget || !purpose) {
      alert("예산과 목적을 모두 입력해주세요!");
      return;
    }

    loadingDiv.style.display = "block";
    resultDiv.style.display = "none";

    const prompt = `
      너는 내 웹사이트의 전문 견적 컨설턴트야.
      
      [내 데이터목록]
      ${JSON.stringify(myProducts)}

      [고객 조건]
      - 예산: ${budget}
      - 목적 및 요청사항: ${purpose}

      위 [내 데이터목록] 중에서 고객 조건에 가장 어울리는 항목들을 선별해서 추천해줘.
      응답 양식:
      1. **추천 구성/매물 목록** (제품명 및 가격)
      2. **총 예상 견적**
      3. **이 조합/매물을 추천하는 이유** (친절하고 명확하게)
    `;

    // 최신 v1 및 v1beta 앤드포인트 자동 호환 처리
    const endpoints = [
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`,
      `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${API_KEY}`
    ];

    let response = null;
    let data = null;

    for (const url of endpoints) {
      try {
        response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        if (response.ok) {
          data = await response.json();
          break;
        }
      } catch (e) {
        console.warn("API 시도 중 예외 발생:", e);
      }
    }

    try {
      if (data && data.candidates && data.candidates[0].content.parts[0].text) {
        const aiText = data.candidates[0].content.parts[0].text;
        resultDiv.innerHTML = aiText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        resultDiv.style.display = "block";
      } else {
        throw new Error("API 응답 구조 실패");
      }
    } catch (error) {
      alert("오류가 발생했습니다. 구글 AI 스튜디오에서 키 권한 상태를 확인해주세요.");
      console.error(error);
    } finally {
      loadingDiv.style.display = "none";
    }
  }
